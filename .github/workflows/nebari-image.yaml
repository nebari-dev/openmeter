name: Nebari image

# Builds OpenMeter with app secrets (such as Stripe API keys) encrypted at
# rest, published as ghcr.io/nebari-dev/openmeter and quay.io/nebari/openmeter.
#
# Each nebari/<upstream release> branch carries the fork's commits on top of
# that upstream release tag. Pushing a branch runs the tests; pushing a tag
# <upstream release>-nebari.<n> (e.g. v1.0.0-beta.234-nebari.1) also publishes
# the image, tagged with that name and sha-<short sha>.
on:
  push:
    branches: ['nebari/**']
    tags: ['v*-nebari.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway database for the Stripe app tests, reachable only from this job.
    services:
      postgres:
        image: postgres:14.20-alpine3.23@sha256:14f02666642586a64d6fae8ef42d479fd76456a77c73ae8a626b8fe323b76d22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go test ./openmeter/secret/... ./app/config/... ./app/common/... ./test/app/stripe/...

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The final stage runs `apk add`, so the arm64 build needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            for tag in "${GITHUB_REF_NAME}" "sha-${GITHUB_SHA::7}"; do
              echo "ghcr.io/nebari-dev/openmeter:${tag}"
              echo "quay.io/nebari/openmeter:${tag}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
