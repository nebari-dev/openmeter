name: Nebari image

# Builds OpenMeter with app secrets (such as Stripe API keys) encrypted at
# rest, published as ghcr.io/nebari-dev/openmeter/openmeter:sha-<short sha>.
on:
  push:
    branches: [encrypted-secrets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway database for the Stripe app tests, reachable only from this job.
    services:
      postgres:
        image: postgres:14.20-alpine3.23@sha256:14f02666642586a64d6fae8ef42d479fd76456a77c73ae8a626b8fe323b76d22
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go test ./openmeter/secret/... ./app/config/... ./app/common/... ./test/app/stripe/...

  image:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@ddc8bd9f17cf1d6844bc2b5fb52825ed70f1a688 # v1
    with:
      image: openmeter
      context: "."
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
